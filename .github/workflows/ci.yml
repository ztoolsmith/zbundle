name: CI

# Deux jobs, comme zcompiler. L'atout Zig — la cross-compilation depuis Linux —
# fait tenir toute la logique et 5 des 6 binaires sur `ubuntu-latest`. La seule
# vraie 2ᵉ plateforme reste Windows, à cause de la libc MSVC que Zig ne fournit
# pas.
#
# Différence avec zcompiler : zbundle a DEUX dépendances siblings (zignapi ET
# zcompiler) — c'est le sommet de la pile de l'org, donc on checkout trois repos.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call: # réutilisé comme gate par release.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIG_VERSION: 0.16.0 # épinglée = `minimum_zig_version` du build.zig.zon

jobs:
  # ── Job principal : toute la logique + cross-compilation, sur Linux ──────────
  main:
    name: Test + juge + cross (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zbundle
        uses: actions/checkout@v4
        with:
          path: zbundle
      # zbundle référence zignapi ET zcompiler en SIBLINGS (chemins ../../../…
      # dans build.zig.zon). Les deux doivent être là, au bon endroit.
      # NB : adapter le `repository` (et un PAT si les repos sont privés).
      - name: Checkout zignapi (sibling)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/zignapi
          path: zignapi
      - name: Checkout zcompiler (sibling)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/zcompiler
          path: zcompiler

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: zbundle/pnpm-lock.yaml

      # zignapi fournit le CLI (`zignapi build`) + le module Zig `zignapi`.
      - name: Build zignapi (CLI + module)
        working-directory: zignapi
        run: |
          pnpm install --frozen-lockfile=false
          pnpm --filter zignapi build

      # zcompiler fournit le module Zig `zcompiler` (compilé DANS le binaire de
      # zbundle) et le paquet npm que le playground importe pour ses références
      # TS/JSX. Son build natif suffit — pas de wasm ici.
      - name: Build zcompiler (module + addon)
        working-directory: zcompiler
        run: |
          pnpm install --frozen-lockfile=false
          pnpm --filter zcompiler build

      - name: Install zbundle
        working-directory: zbundle
        run: pnpm install --frozen-lockfile=false

      - name: Zig unit tests (resolver + graph + shake + linker)
        working-directory: zbundle/packages/zbundle
        run: zig build test

      - name: Build (addon + loader, puis le CLI)
        working-directory: zbundle/packages/zbundle
        run: pnpm build

      - name: node --test (surface JS + CLI)
        working-directory: zbundle/packages/zbundle
        run: pnpm test

      # Les fixtures de GRAPHE : comparaison stricte à leur expected.json
      # (modules, arêtes DANS L'ORDRE, externals, cycles).
      - name: Corpus — fixtures de graphe
        working-directory: zbundle
        run: node playground/corpus.js --graph corpus/fixtures

      # Les projets-témoins tiers sont gitignorés (convention de l'org) : on les
      # installe ici pour que le vrai monde soit couvert en CI aussi.
      - name: Installer les projets-témoins (lodash-es & co)
        working-directory: zbundle/corpus/real
        run: npm install --no-audit --no-fund

      - name: Corpus — projets-témoins (no-crash + stats)
        working-directory: zbundle
        run: node playground/corpus.js --real corpus/real

      # LE JUGE, à chaque commit : pour chaque projet, le bundle s'EXÉCUTE et
      # doit dire exactement ce que dit l'original ; le code mort est vérifié
      # ABSENT textuellement ; les exports sont vérifiés par un TÉMOIN-IMPORTEUR ;
      # et chaque refus v0.2 doit produire une erreur explicative.
      # `run.mjs` sort en code ≠ 0 sur échec → vrai gate.
      - name: LE JUGE (playground/run.mjs)
        working-directory: zbundle
        run: node playground/run.mjs

      # Cross-compilation : les 5 triples non-Windows se produisent depuis Linux.
      # (Aucun chargement de binaire étranger ici — ça se teste au job Windows
      #  et à la prod simulée.)
      - name: Cross-compile tous les triples (artefacts seulement)
        working-directory: zbundle/packages/zbundle
        run: |
          pnpm exec zignapi build --all || true # win32-msvc échoue (SDK MSVC absent)
          for t in darwin-arm64 darwin-x64 linux-x64-gnu linux-x64-musl linux-arm64-gnu; do
            test -f "npm/$t/zbundle.$t.node" || { echo "::error::npm/$t manquant"; exit 1; }
          done
          echo "✓ 5 triples cross-compilés"

      # Prod simulée : npm pack → témoin VIDE → `require("zbundle")` ET la
      # commande `zbundle` doivent marcher depuis le paquet publié.
      - name: Prod simulée (le paquet publié démarre-t-il ?)
        working-directory: zbundle/packages/zbundle
        run: |
          pnpm exec zignapi prepublish
          node scripts/prod-witness.mjs

  # ── Job Windows : la seule vraie 2ᵉ plateforme (libc MSVC) ───────────────────
  windows:
    name: Build natif + smoke test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zbundle
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/zignapi
          path: zignapi
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/zcompiler
          path: zcompiler
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build zignapi
        working-directory: zignapi
        run: |
          pnpm install --frozen-lockfile=false
          pnpm --filter zignapi build
      - name: Install zcompiler (module Zig seulement)
        working-directory: zcompiler
        run: pnpm install --frozen-lockfile=false
      - name: Install zbundle
        working-directory: zbundle
        run: pnpm install --frozen-lockfile=false

      # Sur windows-latest l'hôte EST win32-x64-msvc → le build natif produit le
      # .node MSVC directement. Smoke test : on bundle pour de vrai et on vérifie
      # la sortie (le job principal couvre la logique ; celui-ci le binaire).
      - name: Build natif win32-x64-msvc
        working-directory: zbundle/packages/zbundle
        run: pnpm build
      - name: Smoke test (bundler un vrai projet)
        working-directory: zbundle
        run: node -e "const z=require('./packages/zbundle/index.js'); const c=z.bundle('playground/projects/diamond/main.js'); if(!c.includes('const base = 10')||c.split('const base = 10').length!==2){console.error('KO');process.exit(1)} console.log('OK win32 native')"
