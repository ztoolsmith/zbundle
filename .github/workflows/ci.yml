name: CI

# Two jobs, like zcompiler. Zig's advantage — cross-compilation from Linux —
# keeps all the logic and 5 of the 6 binaries on `ubuntu-latest`. The only real
# second platform is Windows, because of the MSVC libc that Zig does not ship.
#
# Difference from zcompiler: zbundle has TWO sibling dependencies (zignapi AND
# zcompiler) — it sits at the top of the stack, so we check out three repos.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call: # reused as a gate by release.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIG_VERSION: 0.16.0 # pinned = `minimum_zig_version` from build.zig.zon

jobs:
  # ── Main job: all the logic + cross-compilation, on Linux ───────────────────
  main:
    name: Test + judge + cross (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zbundle
        uses: actions/checkout@v4
        with:
          path: zbundle
      # zbundle references zignapi AND zcompiler as SIBLINGS (../../../… paths in
      # build.zig.zon). Both must be there, in the right place.
      # NB: adapt `repository` (and add a PAT if the repos are private).
      - name: Checkout zignapi (sibling)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/zignapi
          path: zignapi
      - name: Checkout zcompiler (sibling)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/zcompiler
          path: zcompiler

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: zbundle/pnpm-lock.yaml

      # zignapi provides the CLI (`zignapi build`) plus the `zignapi` Zig module.
      - name: Build zignapi (CLI + module)
        working-directory: zignapi
        run: |
          pnpm install --frozen-lockfile=false
          pnpm --filter zignapi build

      # zcompiler provides the `zcompiler` Zig module (compiled INTO zbundle's
      # binary) and the npm package the playground imports for its TS/JSX
      # references. Its native build is enough — no wasm here.
      - name: Build zcompiler (module + addon)
        working-directory: zcompiler
        run: |
          pnpm install --frozen-lockfile=false
          pnpm --filter zcompiler build

      - name: Install zbundle
        working-directory: zbundle
        run: pnpm install --frozen-lockfile=false

      - name: Zig unit tests (resolver + graph + shake + linker)
        working-directory: zbundle/packages/zbundle
        run: zig build test

      - name: Build (addon + loader, then the CLI)
        working-directory: zbundle/packages/zbundle
        run: pnpm build

      - name: node --test (JS surface + CLI)
        working-directory: zbundle/packages/zbundle
        run: pnpm test

      # The GRAPH fixtures: strict comparison against their expected.json
      # (modules, edges IN ORDER, externals, cycles).
      - name: Corpus — graph fixtures
        working-directory: zbundle
        run: node playground/corpus.js --graph corpus/fixtures

      # The third-party real-world projects are gitignored (org convention): we
      # install them here so the real world is covered in CI too.
      - name: Install the real-world projects (lodash-es & co)
        working-directory: zbundle/corpus/real
        run: npm install --no-audit --no-fund

      - name: Corpus — real-world projects (no crash + stats)
        working-directory: zbundle
        run: node playground/corpus.js --real corpus/real

      # THE JUDGE, on every commit: for each project the bundle is EXECUTED and
      # must say exactly what the original says; dead code is checked to be
      # textually ABSENT; exports are checked by an IMPORTING WITNESS; and every
      # refusal must produce an explanatory error.
      # `run.mjs` exits non-zero on failure -> a real gate.
      - name: THE JUDGE (playground/run.mjs)
        working-directory: zbundle
        run: node playground/run.mjs

      # Cross-compilation: the 5 non-Windows triples are produced from Linux.
      # (No foreign binary is loaded here — that is tested by the Windows job and
      #  by the prod rehearsal.)
      - name: Cross-compile every triple (artifacts only)
        working-directory: zbundle/packages/zbundle
        run: |
          pnpm exec zignapi build --all || true # win32-msvc fails (no MSVC SDK)
          for t in darwin-arm64 darwin-x64 linux-x64-gnu linux-x64-musl linux-arm64-gnu; do
            test -f "npm/$t/zbundle.$t.node" || { echo "::error::npm/$t missing"; exit 1; }
          done
          echo "✓ 5 triples cross-compiled"

      # Prod rehearsal: npm pack -> an EMPTY witness -> `require("zbundle")` AND
      # the `zbundle` command must both work from the published package.
      - name: Prod rehearsal (does the published package start?)
        working-directory: zbundle/packages/zbundle
        run: |
          pnpm exec zignapi prepublish
          node scripts/prod-witness.mjs

  # ── Windows job: the only real second platform (MSVC libc) ──────────────────
  windows:
    name: Native build + smoke test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zbundle
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/zignapi
          path: zignapi
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/zcompiler
          path: zcompiler
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build zignapi
        working-directory: zignapi
        run: |
          pnpm install --frozen-lockfile=false
          pnpm --filter zignapi build
      - name: Install zcompiler (Zig module only)
        working-directory: zcompiler
        run: pnpm install --frozen-lockfile=false
      - name: Install zbundle
        working-directory: zbundle
        run: pnpm install --frozen-lockfile=false

      # On windows-latest the host IS win32-x64-msvc -> the native build produces
      # the MSVC .node directly. Smoke test: bundle for real and check the output
      # (the main job covers the logic; this one covers the binary).
      - name: Native build win32-x64-msvc
        working-directory: zbundle/packages/zbundle
        run: pnpm build
      - name: Smoke test (bundle a real project)
        working-directory: zbundle
        run: node -e "const z=require('./packages/zbundle/index.js'); const c=z.bundle('playground/projects/diamond/main.js'); if(!c.includes('const base = 10')||c.split('const base = 10').length!==2){console.error('KO');process.exit(1)} console.log('OK win32 native')"
