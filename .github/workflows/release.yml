name: Release

# Triggered when you PUBLISH a GitHub release (tag v*, e.g. v0.1.0). The main
# job (ci.yml) acts as the gate: all green or nothing. Then we collect the
# binaries for the 6 triples (Linux cross-compiles the 5 non-Windows ones;
# Windows supplies the MSVC .node), assemble the packages, replay the prod
# rehearsal, then ATTACH the tarballs to the release AND PUBLISH to npm.
#
# Requires an `NPM_TOKEN` secret (npm -> Access Tokens, "Automation" type) in the
# repository's Settings -> Secrets and variables -> Actions.

on:
  release:
    types: [published]
  # Manual fallback trigger (if the `release` event did not fire):
  # Actions -> Release -> Run workflow, or `gh workflow run release.yml -f tag=v0.1.0`.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to (re)publish — e.g. v0.1.0 (it must already exist)"
        required: true

env:
  ZIG_VERSION: 0.16.0
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  # The whole main job (tests + judge + prod rehearsal) runs first.
  gate:
    uses: ./.github/workflows/ci.yml

  # Linux: the 5 darwin/linux triples + the generated JS (loader + compiled CLI).
  linux-artifacts:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: zbundle }
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/zignapi
          path: zignapi
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/zcompiler
          path: zcompiler
      - uses: mlugg/setup-zig@v2
        with: { version: "${{ env.ZIG_VERSION }}" }
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: zbundle/pnpm-lock.yaml }

      - name: Build zignapi (CLI + module)
        working-directory: zignapi
        run: pnpm install --frozen-lockfile=false && pnpm --filter zignapi build
      - name: Install zcompiler (Zig module)
        working-directory: zcompiler
        run: pnpm install --frozen-lockfile=false
      - name: Install zbundle
        working-directory: zbundle
        run: pnpm install --frozen-lockfile=false

      - name: Cross-compile darwin+linux + generate the JS and the CLI
        working-directory: zbundle/packages/zbundle
        run: |
          pnpm build                              # host native + loader + tsc (dist/cli.js)
          pnpm exec zignapi build --all || true   # the 5 cross triples (win32 fails here)
          tar czf /tmp/linux.tgz \
            npm/darwin-arm64 npm/darwin-x64 npm/linux-x64-gnu npm/linux-x64-musl npm/linux-arm64-gnu \
            index.js bindings.js index.d.ts dist

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: /tmp/linux.tgz

  # Windows: the only binary Zig cannot cross-compile from Linux (MSVC libc).
  windows-artifacts:
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: zbundle }
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/zignapi
          path: zignapi
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/zcompiler
          path: zcompiler
      - uses: mlugg/setup-zig@v2
        with: { version: "${{ env.ZIG_VERSION }}" }
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Build zignapi
        working-directory: zignapi
        run: pnpm install --frozen-lockfile=false && pnpm --filter zignapi build
      - name: Install zcompiler
        working-directory: zcompiler
        run: pnpm install --frozen-lockfile=false
      - name: Install zbundle
        working-directory: zbundle
        run: pnpm install --frozen-lockfile=false

      - name: Build + package win32-x64-msvc
        working-directory: zbundle/packages/zbundle
        run: |
          pnpm exec zignapi build --target win32-x64-msvc
          tar czf win32.tgz npm/win32-x64-msvc

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: win32
          path: zbundle/packages/zbundle/win32.tgz

  # Assembly: every binary gathered -> prepublish -> prod rehearsal -> attach to
  # the release + publish to npm.
  assemble:
    needs: [linux-artifacts, windows-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write # `gh release upload`
    steps:
      - uses: actions/checkout@v4
        with: { path: zbundle }
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/zignapi
          path: zignapi
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: zbundle/pnpm-lock.yaml
          registry-url: "https://registry.npmjs.org" # writes .npmrc for npm publish

      # Here we only need zignapi's CLI (tsc), not Zig: the binaries arrive
      # already built from the two previous jobs.
      - name: Build zignapi (CLI only)
        working-directory: zignapi
        run: pnpm install --frozen-lockfile=false && pnpm --filter zignapi build:ts
      - name: Install zbundle
        working-directory: zbundle
        run: pnpm install --frozen-lockfile=false

      - name: Fetch the artifacts (Linux + Windows)
        uses: actions/download-artifact@v4
        with: { path: /tmp/artifacts }

      - name: Unpack every binary into the package
        working-directory: zbundle/packages/zbundle
        run: |
          tar xzf /tmp/artifacts/linux/linux.tgz -C .
          tar xzf /tmp/artifacts/win32/win32.tgz -C .
          ls npm/

      - name: prepublish (assemble npm/<triple>/ + optionalDependencies)
        working-directory: zbundle/packages/zbundle
        run: pnpm exec zignapi prepublish

      # Does the PUBLISHED package start? The API and the command, from an empty witness.
      - name: Prod rehearsal
        working-directory: zbundle/packages/zbundle
        run: node scripts/prod-witness.mjs

      - name: npm pack (main + platforms)
        working-directory: zbundle/packages/zbundle
        run: |
          mkdir -p /tmp/out
          npm pack --pack-destination /tmp/out
          for d in npm/*/; do (cd "$d" && npm pack --pack-destination /tmp/out); done
          ls -la /tmp/out

      - name: Upload the tarballs (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: /tmp/out/*.tgz

      - name: Attach the tarballs to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" /tmp/out/*.tgz --clobber --repo "${{ github.repository }}"

      - name: Publish to npm (platforms first, main last)
        working-directory: /tmp/out
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Platform packages first: otherwise the main package's
          # optionalDependencies point at nothing for a few seconds.
          # --access public: required for scoped packages (@zbundle/*).
          for t in *binding*.tgz; do npm publish "$t" --access public; done
          # Then the main one (the only tarball without "binding" in its name).
          for t in *.tgz; do case "$t" in *binding*) ;; *) npm publish "$t" --access public ;; esac; done
